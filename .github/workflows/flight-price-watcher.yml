name: Flight Price Watcher (BEY -> MEX)

# Runs daily and can be triggered manually from the Actions tab.
on:
  push:
    branches: [claude/flight-price-watcher-lebanon-mexico-17ohcj]
    paths: ['.github/workflows/flight-price-watcher.yml', 'flight_watcher/**']
  schedule:
    # 13:17 UTC daily (off-peak minute on purpose). GitHub may delay scheduled
    # runs under load; exact timing is not guaranteed.
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the updated price_history.json
  issues: write     # maintain the tracker issue + buy alert (emails/pushes you)

concurrency:
  group: flight-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Optional Amadeus upgrade (more precise). Leave unset to use the keyless source.
      AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
      AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
      # Optional daily email. Leave unset to rely on the GitHub tracker issue.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r flight_watcher/requirements.txt

      - name: Check flight prices
        id: check
        run: python flight_watcher/check_prices.py

      - name: Commit updated price history
        run: |
          git config user.name  "flight-watcher-bot"
          git config user.email "actions@github.com"
          git add flight_watcher/price_history.json flight_watcher/latest_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "flight watcher: ${{ steps.check.outputs.dep_date }} ${{ steps.check.outputs.status }} USD ${{ steps.check.outputs.price_usd }} / MXN ${{ steps.check.outputs.price_mxn }}"
            # Reconcile with a possibly-advanced remote, then push with retries.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${{ github.ref_name }}" || true
              if git push origin HEAD:"${{ github.ref_name }}"; then
                echo "pushed"; break
              fi
              echo "push attempt $i failed; retrying"; sleep $((i*3))
            done
          fi

      - name: Update tracker issue & notify
        if: steps.check.outputs.status != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('flight_watcher/latest_result.json')) {
              core.info('no latest_result.json — skipping'); return;
            }
            const r = JSON.parse(fs.readFileSync('flight_watcher/latest_result.json', 'utf8'));
            let hist = [];
            try { hist = JSON.parse(fs.readFileSync('flight_watcher/price_history.json', 'utf8')); } catch (e) {}
            const { owner, repo } = context.repo;
            const LABEL = 'flight-watcher';
            const ME = owner; // repo owner login — assigned + @-mentioned so GitHub emails you

            const ok = r.status === 'ok';
            const mxnNote = r.fx_approx ? ' _(approx FX)_' : '';
            const recent = hist.slice(-14).reverse()
              .map(h => `| ${h.date} | USD ${Math.round(h.price_usd)} | MXN ${h.price_mxn} | ${h.via} | ${h.departure}→${h.return} |`)
              .join('\n');
            const priceLine = ok
              ? `**Latest (${r.date}): USD ${r.price_usd} / MXN ${r.price_mxn}${mxnNote}** via ${r.via}`
              : `**${r.date}: no price recorded — ${r.message}.**`
                + (r.health_alert ? ` ⚠️ no price for ${r.days_since_last_price} days — watcher may be broken.` : '');
            const ruleLine = ok
              ? (`Buy rule: lowest in 2+ weeks. ` + (r.buy_signal ? `**🟢 BUY now.**`
                  : ((r.span_days || 0) < 14 ? `(building history…)` : `Not yet — keep waiting.`)))
              : `Last good price was ${r.last_price_date || 'not yet recorded'}.`;
            const body = [
              `### ✈️ Beirut → Mexico City — round-trip price tracker`, ``,
              priceLine,
              ok ? `All-time low: USD ${r.all_time_low_usd} · days tracked: ${r.history_days} over ${r.span_days}d · source: ${r.source}` : `Source: ${r.source}`,
              ``, ruleLine, ``,
              `| Date | USD | MXN | Via | Trip |`, `|---|---|---|---|---|`, recent, ``,
              `_Updated automatically each day. Full data: flight_watcher/price_history.json_`,
            ].join('\n');

            // Find the tracker issue in ANY state, so a closed one is reused (not duplicated daily).
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'all', labels: LABEL, per_page: 1, sort: 'created', direction: 'desc' });
            let issue = found.data[0];
            let number, isOpen;
            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title: '✈️ BEY→MEX price tracker (Sep 2026)',
                body, labels: [LABEL], assignees: [ME] });
              number = created.data.number; isOpen = true;
            } else {
              number = issue.number; isOpen = issue.state === 'open';
              if (isOpen) {
                await github.rest.issues.update({ owner, repo, issue_number: number, body });
              } else if (r.should_notify && r.buy_signal) {
                // only resurrect a closed tracker for a genuine buy signal
                await github.rest.issues.update({ owner, repo, issue_number: number, state: 'open', body });
                isOpen = true;
              }
            }
            if (!isOpen) { core.info('tracker issue closed; nothing to notify'); return; }

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: number, per_page: 100 });
            const already = (m) => comments.data.some(c => (c.body || '').includes(m));

            // Health alert (deduped per day)
            if (r.health_alert) {
              const m = `<!-- health:${r.date} -->`;
              if (!already(m)) {
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `${m}\n## ⚠️ Watcher may be broken\n@${ME} no price recorded for ${r.days_since_last_price} days (last good: ${r.last_price_date}). Check the Actions tab.` });
              }
            }

            // Buy / new-low alert — throttled by the script (should_notify) and deduped per day.
            if (ok && r.should_notify) {
              const m = `<!-- notify:${r.date}:${r.buy_signal ? 'buy' : 'low'} -->`;
              if (!already(m)) {
                const head = r.buy_signal ? `## 🟢 BUY NOW — lowest price in 2+ weeks` : `## 🔵 New low`;
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: [ m, head, ``,
                    `@${ME} **USD ${r.price_usd} / MXN ${r.price_mxn}${mxnNote}** — BEY→MEX→BEY via ${r.via}`,
                    `Dates: depart ${r.departure}, return ${r.return} · airlines: ${(r.carriers || []).join(', ')}`,
                    r.buy_signal ? `\nThis is your cue to book. Close this issue once you have.` : `` ].join('\n') });
                if (r.buy_signal) {
                  await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['buy-signal'] });
                }
              }
            }

      - name: Email the daily price (optional)
        if: env.MAIL_USERNAME != '' && steps.check.outputs.price_usd != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: Flight Watcher <${{ env.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO || env.MAIL_USERNAME }}
          subject: >-
            ${{ steps.check.outputs.buy_signal == 'true' && '🟢 BUY NOW — ' || '✈️ ' }}BEY→MEX
            USD ${{ steps.check.outputs.price_usd }} / MXN ${{ steps.check.outputs.price_mxn }}
          body: |
            ${{ steps.check.outputs.buy_signal == 'true' && '*** LOWEST PRICE IN 2+ WEEKS — TIME TO BUY ***' || 'Daily flight price check' }}

            Beirut (BEY) -> Mexico City (MEX), round trip, economy
            Best fare today: USD ${{ steps.check.outputs.price_usd }}  |  MXN ${{ steps.check.outputs.price_mxn }}

            One stop via : ${{ steps.check.outputs.via }}
            Airlines     : ${{ steps.check.outputs.carriers }}
            Dates        : depart ${{ steps.check.outputs.dep_date }}, return ${{ steps.check.outputs.ret_date }}
            All-time low : USD ${{ steps.check.outputs.low_usd }}  (${{ steps.check.outputs.hist_days }} days tracked)
