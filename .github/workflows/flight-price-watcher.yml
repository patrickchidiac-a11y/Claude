name: Flight Price Watcher (BEY -> MEX)

# Runs daily and can be triggered manually from the Actions tab.
on:
  push:
    branches: [claude/flight-price-watcher-lebanon-mexico-17ohcj]
    paths: ['.github/workflows/flight-price-watcher.yml', 'flight_watcher/**']
  schedule:
    # 13:17 UTC daily (off-peak minute on purpose). GitHub may delay scheduled
    # runs under load; exact timing is not guaranteed.
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit the updated price_history.json
  issues: write     # maintain the tracker issue + buy alert (emails/pushes you)

concurrency:
  group: flight-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Optional Amadeus upgrade (more precise). Leave unset to use the keyless source.
      AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
      AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
      # Optional daily email. Leave unset to rely on the GitHub tracker issue.
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r flight_watcher/requirements.txt

      - name: Check flight prices
        id: check
        run: python flight_watcher/check_prices.py

      - name: Commit updated price history
        run: |
          git config user.name  "flight-watcher-bot"
          git config user.email "actions@github.com"
          git add flight_watcher/price_history.json flight_watcher/latest_result.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "flight watcher: ${{ steps.check.outputs.dep_date }} fare USD ${{ steps.check.outputs.price_usd }} / MXN ${{ steps.check.outputs.price_mxn }}"
            git push
          fi

      - name: Update tracker issue & notify
        if: steps.check.outputs.price_usd != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('flight_watcher/latest_result.json', 'utf8'));
            const hist = JSON.parse(fs.readFileSync('flight_watcher/price_history.json', 'utf8'));
            const { owner, repo } = context.repo;
            const LABEL = 'flight-watcher';

            const recent = hist.slice(-14).reverse()
              .map(h => `| ${h.date} | USD ${Math.round(h.price_usd)} | MXN ${h.price_mxn} | ${h.via} | ${h.departure}→${h.return} |`)
              .join('\n');
            const body = [
              `### ✈️ Beirut → Mexico City — round-trip price tracker`,
              ``,
              `**Latest (${r.date}): USD ${r.price_usd} / MXN ${r.price_mxn}** via ${r.via}`,
              `All-time low: USD ${r.all_time_low_usd} · days tracked: ${r.history_days} · source: ${r.source}`,
              ``,
              `Buy rule: alert when today's fare is the lowest in ≥14 days. ` +
              (r.buy_signal ? `**🟢 BUY now.**` : (r.history_days < 14 ? `(building history…)` : `Not yet — keep waiting.`)),
              ``,
              `| Date | USD | MXN | Via | Trip |`,
              `|---|---|---|---|---|`,
              recent,
              ``,
              `_Updated automatically each day. Full data: flight_watcher/price_history.json_`,
            ].join('\n');

            // find or create the tracker issue
            const found = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 1 });
            let issue = found.data[0];
            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title: '✈️ BEY→MEX price tracker (Sep 2026)',
                body, labels: [LABEL] });
              issue = created.data;
            } else {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            }

            // notify (comment) only on a buy signal or a new all-time low
            if (r.buy_signal || r.is_new_low) {
              const head = r.buy_signal
                ? `## 🟢 BUY NOW — lowest price in 2+ weeks`
                : `## 🔵 New low so far`;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  head, ``,
                  `**USD ${r.price_usd} / MXN ${r.price_mxn}** — BEY→MEX→BEY via ${r.via}`,
                  `Dates: depart ${r.departure}, return ${r.return} · airlines: ${r.carriers.join(', ')}`,
                  r.buy_signal ? `\nThis is your cue to book. Close this issue once you have.` : ``,
                ].join('\n') });
              if (r.buy_signal) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number,
                  labels: ['buy-signal'] });
              }
            }

      - name: Email the daily price (optional)
        if: env.MAIL_USERNAME != '' && steps.check.outputs.price_usd != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ env.MAIL_USERNAME }}
          password: ${{ env.MAIL_PASSWORD }}
          from: Flight Watcher <${{ env.MAIL_USERNAME }}>
          to: ${{ env.MAIL_TO }}
          subject: >-
            ${{ steps.check.outputs.buy_signal == 'true' && '🟢 BUY NOW — ' || '✈️ ' }}BEY→MEX
            USD ${{ steps.check.outputs.price_usd }} / MXN ${{ steps.check.outputs.price_mxn }}
          body: |
            ${{ steps.check.outputs.buy_signal == 'true' && '*** LOWEST PRICE IN 2+ WEEKS — TIME TO BUY ***' || 'Daily flight price check' }}

            Beirut (BEY) -> Mexico City (MEX), round trip, economy
            Best fare today: USD ${{ steps.check.outputs.price_usd }}  |  MXN ${{ steps.check.outputs.price_mxn }}

            One stop via : ${{ steps.check.outputs.via }}
            Airlines     : ${{ steps.check.outputs.carriers }}
            Dates        : depart ${{ steps.check.outputs.dep_date }}, return ${{ steps.check.outputs.ret_date }}
            All-time low : USD ${{ steps.check.outputs.low_usd }}  (${{ steps.check.outputs.hist_days }} days tracked)
